name: Web E2E (Selenium)

on:
  push:
    branches: ['**']
  pull_request:
    paths:
      - 'e2e-web/**'
  workflow_dispatch:

jobs:
  selenium-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: e2e-web/package-lock.json

      - name: Install dependencies
        working-directory: e2e-web
        run: npm ci

      - name: Serve the site under test
        if: ${{ vars.WEB_APP_URL == '' }}
        working-directory: e2e-web/site-under-test
        run: |
          python3 -m http.server 5173 &
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5173/ || true)
            if [ "$code" = "200" ]; then echo "Site is up"; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:5173/ > /dev/null

      - name: Run Selenium E2E suite
        working-directory: e2e-web
        env:
          BASE_URL: ${{ vars.WEB_APP_URL || 'http://127.0.0.1:5173' }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: npm test

      - name: Upload Excel report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: selenium-report
          path: e2e-web/reports/selenium-report.xlsx
          if-no-files-found: warn

      - name: Step summary
        if: always()
        run: |
          echo "### Web E2E (Selenium) results" >> "$GITHUB_STEP_SUMMARY"
          echo "See the uploaded \`selenium-report\` artifact for the full Excel breakdown." >> "$GITHUB_STEP_SUMMARY"
