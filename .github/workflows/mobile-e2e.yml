name: Mobile E2E (Appium)

on:
  push:
    branches: ['**']
    paths:
      - 'appium-mobile/**'
      - 'frontend/**'
      - '.github/workflows/mobile-e2e.yml'
  pull_request:
    paths:
      - 'appium-mobile/**'
      - 'frontend/**'
  workflow_dispatch:

jobs:
  appium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: appium-mobile/package-lock.json

      - name: Build debug APK
        working-directory: frontend
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Install Appium suite dependencies
        working-directory: appium-mobile
        run: npm ci

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-29

      - name: Create AVD snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run Appium mobile E2E suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r frontend/app/build/outputs/apk/debug/app-debug.apk
            cd appium-mobile
            npx appium --log-level info --port 4723 > appium.log 2>&1 &
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4723/status || true)
              if [ "$code" = "200" ]; then echo "Appium is ready"; break; fi
              sleep 2
            done
            npm test

      - name: Upload Excel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-report
          path: appium-mobile/reports/appium-report.xlsx
          if-no-files-found: warn

      - name: Upload Appium server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-server-log
          path: appium-mobile/appium.log
          if-no-files-found: ignore

      - name: Step summary
        if: always()
        run: |
          echo "### Mobile E2E (Appium) results" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran against a fresh Android 10 (API 29) emulator, not a physical device." >> "$GITHUB_STEP_SUMMARY"
          echo "See the uploaded \`appium-report\` artifact for the full Excel breakdown." >> "$GITHUB_STEP_SUMMARY"
