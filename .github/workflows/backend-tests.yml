name: Backend Tests (Pytest)

on:
  push:
    branches: ['**']
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend unit & API tests
        working-directory: backend
        run: python scripts/generate_test_report.py

      - name: Upload Excel report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-report
          path: backend/reports/backend-report.xlsx
          if-no-files-found: warn

      - name: Step summary
        if: always()
        run: |
          echo "### Backend Tests (Pytest) results" >> "$GITHUB_STEP_SUMMARY"
          echo "See the uploaded \`backend-report\` artifact for the full Excel breakdown." >> "$GITHUB_STEP_SUMMARY"
